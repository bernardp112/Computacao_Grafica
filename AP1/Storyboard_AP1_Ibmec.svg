<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="460" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#111">Storyboard — AP1 Ibmec (15s / 360 frames)</text>

  <!-- Panel 1 -->
  <g>
    <rect x="30" y="60" width="350" height="220" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="205" y="90" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">I b m e c</text>
    <text x="90" y="90" font-family="Arial" font-size="30" fill="#bbb">I</text>
    <text x="130" y="90" font-family="Arial" font-size="30" fill="#bbb">b</text>
    <text x="170" y="90" font-family="Arial" font-size="30" fill="#bbb">m</text>
    <text x="220" y="90" font-family="Arial" font-size="30" fill="#bbb">e</text>
    <text x="260" y="90" font-family="Arial" font-size="30" fill="#bbb">c</text>
    <!-- lamp sketch -->
    <line x1="120" y1="120" x2="150" y2="170" stroke="#222" stroke-width="4"/>
    <circle cx="150" cy="180" r="14" fill="#222"/>
    <!-- orb sketch -->
    <circle cx="200" cy="220" r="12" fill="#222"/>
    <!-- claw sketch -->
    <path d="M250 150 L260 190 M280 150 L280 190 M310 150 L300 190" stroke="#222" stroke-width="4" fill="none"/>
    <text x="205" y="260" text-anchor="middle" font-family="Arial" font-size="13" fill="#555">Objetos entram desalinhados; palavra fragmentada</text>
    <text x="205" y="300" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#111">1. INÍCIO (0–90)</text>
  </g>

  <!-- Panel 2 -->
  <g>
    <rect x="425" y="60" width="350" height="220" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="440" y="150" font-family="Arial" font-size="30" fill="#111">I</text>
    <line x1="450" y1="90" x2="450" y2="120" stroke="#222" stroke-width="4"/>
    <circle cx="450" cy="128" r="14" fill="#222"/>
    <text x="480" y="150" font-family="Arial" font-size="30" fill="#111">b m e</text>
    <circle cx="620" cy="145" r="10" fill="#222"/>
    <path d="M660 120 L670 160 M690 120 L690 160 M720 120 L710 160" stroke="#222" stroke-width="4" fill="none"/>
    <text x="600" y="260" text-anchor="middle" font-family="Arial" font-size="13" fill="#555">Luminária ajusta o I / orbe encaixa no ponto / garra fecha o C</text>
    <text x="600" y="300" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#111">2. TRANSFORMAÇÃO (90–240)</text>
  </g>

  <!-- Panel 3 -->
  <g>
    <rect x="820" y="60" width="350" height="220" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="995" y="160" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#111">Ibmec</text>
    <circle cx="960" cy="140" r="4" fill="#222"/>
    <text x="995" y="260" text-anchor="middle" font-family="Arial" font-size="13" fill="#555">Palavra completa, legível, câmera estabilizada</text>
    <text x="995" y="300" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#111">3. ENCERRAMENTO (240–360)</text>
  </g>

  <text x="600" y="340" text-anchor="middle" font-family="Arial" font-size="12" fill="#888">Sketch simplificado — não representa a modelagem final</text>
</svg>
