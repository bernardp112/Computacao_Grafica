<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="460" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#111">Storyboard FINAL — AP2 Ibmec (15s / 360 frames, 24fps)</text>

  <!-- Panel 1 -->
  <g>
    <rect x="20" y="60" width="275" height="230" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <!-- lamp falling -->
    <circle cx="90" cy="90" r="10" fill="#e6e6e6" stroke="#999"/>
    <line x1="90" y1="100" x2="90" y2="150" stroke="#999" stroke-width="3"/>
    <rect x="75" y="150" width="30" height="10" fill="#cfcfcf" stroke="#999"/>
    <!-- letter I intact -->
    <rect x="150" y="150" width="14" height="90" fill="#16213e"/>
    <text x="200" y="210" font-family="Arial" font-size="30" fill="#16213e" opacity="0.5">bmec</text>
    <text x="157" y="270" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Luminária branca cai; "I" ainda inteiro</text>
    <text x="157" y="300" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#111">1. QUEDA — frames 1–49</text>
  </g>

  <!-- Panel 2 -->
  <g>
    <rect x="310" y="60" width="275" height="230" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <rect x="380" y="150" width="40" height="18" fill="#cfcfcf" stroke="#999"/>
    <line x1="400" y1="150" x2="400" y2="90" stroke="#999" stroke-width="5"/>
    <circle cx="400" cy="80" r="12" fill="#e6e6e6" stroke="#999"/>
    <rect x="393" y="230" width="14" height="25" fill="#16213e" opacity="0.3"/>
    <text x="447" y="270" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Impacto (f.50): luminária esmaga e achata o "I", que some</text>
    <text x="447" y="300" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#111">2. IMPACTO — frame 50–64</text>
  </g>

  <!-- Panel 3 -->
  <g>
    <rect x="600" y="60" width="275" height="230" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <rect x="660" y="150" width="40" height="18" fill="#cfcfcf" stroke="#999"/>
    <line x1="680" y1="150" x2="680" y2="90" stroke="#999" stroke-width="5"/>
    <circle cx="680" cy="80" r="12" fill="#e6e6e6" stroke="#999"/>
    <text x="720" y="200" font-family="Arial" font-size="26" fill="#16213e">b</text>
    <path d="M760 160 L770 190 M790 160 L790 190 M820 160 L810 190" stroke="#777" stroke-width="3" fill="none"/>
    <text x="737" y="270" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Garra fecha, pega e entrega b → m → e → c, uma a uma</text>
    <text x="737" y="300" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#111">3. ENTREGA — frames 90–320</text>
  </g>

  <!-- Panel 4 -->
  <g>
    <rect x="890" y="60" width="290" height="230" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <rect x="950" y="150" width="40" height="18" fill="#e8e8e8" stroke="#999"/>
    <line x1="970" y1="150" x2="970" y2="90" stroke="#bbb" stroke-width="5"/>
    <circle cx="970" cy="75" r="10" fill="#f5a623"/>
    <text x="1010" y="200" font-family="Arial" font-size="26" fill="#16213e">bmec</text>
    <text x="1035" y="270" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Orbe laranja pousa sobre a luminária e acende (farol)</text>
    <text x="1035" y="300" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#111">4. ENCERRAMENTO — frames 320–360</text>
  </g>

  <text x="600" y="330" text-anchor="middle" font-family="Arial" font-size="12" fill="#888">Sketch simplificado — cores finais: letras azul-marinho, luminária branca, orbe laranja</text>
</svg>
